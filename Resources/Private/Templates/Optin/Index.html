{namespace sg=SGalinski\SgCookieOptin\ViewHelpers}
<f:layout name="{f:if(condition: useEmptyLayout, then: 'Empty', else: 'Default')}"/>

<f:section name="Content">
	<h1><f:translate key="backend.moduleHeader" /></h1>
	<f:if condition="{isSiteRoot}">
		<f:then>
			<p><f:translate key="backend.moduleDescription" /></p>
			<f:flashMessages as="flashMessages">
				<div class="typo3-messages">
					<f:for each="{flashMessages}" as="flashMessage">
						<div class="callout callout-{flashMessage.severity.cssClass}">
							<div class="media">
								<div class="media-left">
									<span class="icon-emphasized">
										<core:icon identifier="{flashMessage.severity.iconIdentifier}" size="small" />
									</span>
								</div>
								<div class="media-body">
									<f:if condition="{flashMessage.title}">
										<h4>{flashMessage.title}</h4>
									</f:if>
									<p>{flashMessage.message}</p>
								</div>
							</div>
						</div>
					</f:for>
				</div>
			</f:flashMessages>

			<f:if condition="{pageUid}">
				<f:if condition="{isSiteRoot}">
					<f:if condition="{optins -> f:count()} <= 0">
						<div class="form-group">
							<f:link.action action="create" class="btn btn-default form-group ">
								<span class="t3js-icon icon icon-size-small icon-state-default icon-actions-plus" data-identifier="actions-plus">
									<span class="icon-markup">
										<svg class="icon-color"><use xlink:href="{f:uri.resource(path: 'EXT:core/Resources/Public/Icons/T3Icons/sprites/actions.svg#actions-plus')}"></use></svg>
									</span>
								</span>
								<f:translate key="backend.createRecord" />
							</f:link.action>
						</div>
					</f:if>
				</f:if>
			</f:if>

			<f:if condition="{optins}">
				<div class="panel panel-default recordlist overflow-visible">
					<div class="table-fit">
						<table data-table="tx_sgcookieoptin_domain_model_optin" class="table table-striped table-hover">
							<tbody>
							<f:for each="{optins}" as="optin">
								<tr data-uid="{optin.uid}">
									<td nowrap="nowrap" class="col-icon">
										<f:format.raw><sg:backend.icon table="tx_sgcookieoptin_domain_model_optin" row="{optin}" /></f:format.raw>
									</td>

									<td nowrap="nowrap">
										<a href="#" class="sg-cookie-optin-edit-record-link" data-edit-href="{sg:backend.editOnClick(table: 'tx_sgcookieoptin_domain_model_optin', uid: optin.uid, pid:optin.pid)}">
											<span>{optin.header}</span>
										</a>
									</td>

									<td nowrap="nowrap" class="col-control">
										<f:format.raw><sg:backend.control table="tx_sgcookieoptin_domain_model_optin" row="{optin}" /></f:format.raw>
									</td>
								</tr>
							</f:for>
							</tbody>
						</table>
					</div>
				</div>
			</f:if>

			<f:if condition="{licenseTitle}">
				<div class="typo3-messages">
					<f:if condition="{licenseError} == '0'">
						<f:variable name="severity">info</f:variable>
					</f:if>
					<f:if condition="{licenseError} == '1'">
						<f:variable name="severity">danger</f:variable>
					</f:if>
					<f:if condition="{licenseError} == '2'">
						<f:variable name="severity">warning</f:variable>
					</f:if>
					<div class="callout callout-{severity}">
						<div class="media">
							<div class="media-left">
								<span class="icon-emphasized">
									<f:if condition="{licenseError} == '1'">
										<f:then>
											<core:icon identifier="actions-close" size="small" />
										</f:then>
										<f:else>
											<core:icon identifier="actions-info" size="small" />
										</f:else>
									</f:if>
								</span>
							</div>
							<div class="media-body">
								<h4>{licenseTitle}</h4>
								<p>{licenseMessage}</p>
							</div>
						</div>
					</div>
				</div>
			</f:if>

			<div class="typo3-messages">
				<div class="callout callout-info">
					<div class="media">
						<div class="media-left">
							<span class="icon-emphasized">
								<core:icon identifier="actions-info" size="small" />
							</span>
						</div>
						<div class="media-body">
							<h4><f:translate key="backend.consentMode.header" /></h4>
							<p><f:translate key="backend.consentMode.text" /> <a class="btn btn-default btn-sm text-decoration-none" href="{f:translate(key:'backend.consentMode.buttonUrl')}" target="_blank"><f:translate key="backend.consentMode.buttonText" /></a></p>
						</div>
					</div>
				</div>
			</div>

			<div class="typo3-messages">
				<div class="callout callout-info">
					<div class="media">
						<div class="media-left">
							<span class="icon-emphasized">
								<core:icon identifier="actions-info" size="small" />
							</span>
						</div>
						<div class="media-body">
							 <h4><f:translate key="backend.addScripts" /></h4>
							 <p><f:translate key="backend.toolForCookies" /> <a class="btn btn-default btn-sm text-decoration-none" href="https://www.cookieserve.com/" target="_blank"><f:translate key="backend.toolForCookies.button" /></a></p>
			         	</div>
			      	</div>
			   	</div>
			</div>
			<div class="typo3-messages">
				<div class="callout callout-info">
					<div class="media">
						<div class="media-left">
						<span class="icon-emphasized">
							<core:icon identifier="actions-info" size="small" />
						</span>
						</div>
						<div class="media-body">
							<h4><f:translate key="backend.addContentElementToDataPrivacy" /></h4>
							<p><f:translate key="backend.addOpenUpLinkToDataPrivacy" /></p>
						</div>
					</div>
				</div>
			</div>
		</f:then>
		<f:else>
			<f:flashMessages as="flashMessages">
				<div class="typo3-messages">
					<f:for each="{flashMessages}" as="flashMessage">
						<div class="callout callout-{flashMessage.severity.cssClass}">
							<div class="media">
								<div class="media-left">
									<span class="icon-emphasized">
										<core:icon identifier="{flashMessage.severity.iconIdentifier}" size="small" />
									</span>
								</div>
								<div class="media-body">
									<f:if condition="{flashMessage.title}">
										<h4>{flashMessage.title}</h4>
									</f:if>
									<p>{flashMessage.message}</p>
								</div>
							</div>
						</div>
					</f:for>
				</div>
			</f:flashMessages>
			<f:if condition="{pages}">
				<f:then>
					<f:render partial="SelectRoot" arguments="{pages: pages}" />
				</f:then>
				<f:else>
					<div class="callout callout-warning">
						<div class="media">
							<div class="media-left">
								<span class="icon-emphasized">
									<core:icon identifier="actions-exclamation" size="small" />
								</span>
							</div>
							<div class="media-body">
								{f:translate(key:'backend.no_site_root_found')}
							</div>
						</div>
					</div>
				</f:else>
			</f:if>
		</f:else>
	</f:if>
</f:section>
